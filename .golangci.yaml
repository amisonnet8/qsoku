# golangci-lint v2 configuration. Check this file with: golangci-lint config verify
version: "2"

run:
  # The end-to-end tests will be built with this tag (mirrors mtqg's Makefile).
  build-tags:
    - e2e

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # Layer boundaries (directory-structure.md): internal/qsokufile and
    # internal/run must not depend on internal/cli.
    - depguard
    # The core returns structured errors; wrapping must use errors.Is/As.
    - errorlint
    # qsoku writes files (qsokufile) that other people commit and read, and
    # runs commands built from qsokufile text (G204 is qsoku's own job, not
    # a mistake -- do not silence it without writing down why it is safe).
    - gosec
    # Comments, commit messages and CLI output are English.
    - misspell
    # Every //nolint must name the linter and say why.
    - nolintlint
    - nilerr
    - unconvert
    - usestdlibvars

  # forbidigo (user-facing text confined to the cli layer) is not configured
  # yet: internal/qsokufile has no user-facing text to confine. Add it if a
  # layer that could gain one shows up (directory-structure.md).

  settings:
    depguard:
      rules:
        # Dependency direction is cli -> {qsokufile, run}, never the reverse,
        # and qsokufile and run do not depend on each other either.
        qsokufile:
          list-mode: lax
          files:
            - "**/internal/qsokufile/**"
          deny:
            - pkg: github.com/amisonnet8/qsoku/internal/cli
              desc: the qsokufile layer must not depend on an entry point
            - pkg: github.com/amisonnet8/qsoku/internal/run
              desc: qsokufile only parses and rewrites text; it does not run anything
        run:
          list-mode: lax
          files:
            - "**/internal/run/**"
          deny:
            - pkg: github.com/amisonnet8/qsoku/internal/cli
              desc: the run layer must not depend on an entry point
            - pkg: github.com/amisonnet8/qsoku/internal/qsokufile
              desc: run only knows how to execute a command string; it does not know what a qsokufile is

    nolintlint:
      require-explanation: true
      require-specific: true

    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/amisonnet8/qsoku
