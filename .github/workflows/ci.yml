name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      # windows-latest has no `make` (Makefile assumes a POSIX shell -- see
      # its own header comment), so its steps call go/golangci-lint
      # directly instead of through make check/make test. sh itself (Git
      # for Windows) and pwsh are both present on windows-latest by default
      # (docs/reference/cli.md "Shell integration"); zsh/fish e2e tests skip
      # themselves there (e2e/shell_test.go shellPath).
      - name: make check
        if: runner.os != 'Windows'
        run: make check
      - name: check (windows)
        if: runner.os == 'Windows'
        run: |
          go vet ./...
          go vet -tags e2e ./e2e/...
          golangci-lint run
          go test ./...
      # e2e (started in Step 7, docs/reference/ examples added in Step 8)
      # runs the real binary against real shells, on every OS in the matrix.
      - name: make test
        if: runner.os != 'Windows'
        run: make test
      - name: test (windows)
        if: runner.os == 'Windows'
        run: go test -tags e2e -count=1 ./e2e/...

  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make race
        run: make race

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make shellcheck
        run: make shellcheck

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.71.2
      - name: make trivy
        run: make trivy

  # .goreleaser.yaml (distribution.md) drives release.yml, which only runs
  # when a human pushes a version tag. Validating it here, on every push,
  # catches a broken config long before anyone tags a real release.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          # "~> v2" tracks the latest v2.x release automatically (never v3,
          # which could break .goreleaser.yaml's v2-schema config). Same
          # constraint release.yml uses, and matches .devcontainer/
          # postCreate.sh's "go install .../goreleaser/v2@latest" (that
          # import path is likewise pinned to v2).
          version: "~> v2"
          install-only: true
      - name: make goreleaser-check
        run: make goreleaser-check
