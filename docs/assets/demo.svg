<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="A terminal running qsoku .init, .add and .list">
  <title>qsoku: .init, .add, .list</title>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 15px;
    }
    .term-bg { fill: #0f172a; }
    .term-bar { fill: #1e293b; }
    .term-title { fill: #94a3b8; font-size: 12px; }
    .term-dot-r { fill: #f87171; }
    .term-dot-y { fill: #fbbf24; }
    .term-dot-g { fill: #34d399; }
    .term-prompt { fill: #34d399; }
    .term-cmd { fill: #f1f5f9; }
    .term-out { fill: #94a3b8; }
  </style>

  <rect class="term-bg" x="0" y="0" width="640" height="260" rx="12"/>
  <rect class="term-bar" x="0" y="0" width="640" height="32" rx="12"/>
  <rect class="term-bar" x="0" y="20" width="640" height="12"/>
  <circle class="term-dot-r" cx="22" cy="16" r="6"/>
  <circle class="term-dot-y" cx="44" cy="16" r="6"/>
  <circle class="term-dot-g" cx="66" cy="16" r="6"/>
  <text class="term-title" x="320" y="20" text-anchor="middle">qsoku</text>

  <text x="20" y="62"><tspan class="term-prompt">$ </tspan><tspan class="term-cmd">qsoku .init</tspan></text>
  <text class="term-out" x="20" y="88">Created /home/you/project/qsokufile</text>

  <text x="20" y="114"><tspan class="term-prompt">$ </tspan><tspan class="term-cmd">qsoku .add build 'go build ./...'</tspan></text>
  <text x="20" y="140"><tspan class="term-prompt">$ </tspan><tspan class="term-cmd">qsoku .add test 'go test ./...'</tspan></text>

  <text x="20" y="166"><tspan class="term-prompt">$ </tspan><tspan class="term-cmd">qsoku .list</tspan></text>
  <text class="term-out" x="20" y="192">build: go build ./...</text>
  <text class="term-out" x="20" y="218">test: go test ./...</text>
</svg>
