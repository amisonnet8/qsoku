version: 2

project_name: qsoku

builds:
  - id: qsoku
    main: ./cmd/qsoku
    binary: qsoku
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/amisonnet8/qsoku/internal/cli.version={{.Tag}}

archives:
  - id: qsoku
    formats: [tar.gz]
    # Windows users expect a .zip, not a .tar.gz (distribution.md).
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

release:
  github:
    owner: amisonnet8
    name: qsoku
